name: Record demo video

on:
  workflow_dispatch:
  push:
    branches: [claude/native-ios-app]
    paths:
      - "TLLV/**"
      - "TLLVUITests/**"
      - "TLLV.xcodeproj/**"
      - ".github/workflows/demo-video.yml"

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds]
          for wanted in ["iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro"]:
              match = [d for d in phones if d["name"] == wanted]
              if match:
                  print(match[0]["udid"]); break
          else:
              print([d for d in phones if d["name"].startswith("iPhone")][0]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build app and UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project TLLV.xcodeproj -scheme TLLV \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|BUILD|TEST" || true
          grep -qE "TEST BUILD SUCCEEDED|BUILD SUCCEEDED" build.log

      - name: Prepare simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          APP=$(find build/Build/Products -name "TLLV.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant location com.thelittlelondonvegan.app || true
          xcrun simctl location "$UDID" set 51.5136,-0.1365 || true
          # Warm up: first launch downloads the latest content.
          xcrun simctl launch "$UDID" com.thelittlelondonvegan.app -TLLVDemoMode
          sleep 15
          xcrun simctl terminate "$UDID" com.thelittlelondonvegan.app || true

      - name: Record walkthrough
        run: |
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force demo-raw.mp4 &
          REC=$!
          sleep 2
          set +e
          mkdir -p shots
          TEST_RUNNER_SHOT_DIR="$PWD/shots" xcodebuild test-without-building \
            -project TLLV.xcodeproj -scheme TLLV \
            -resultBundlePath result.xcresult \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build \
            -only-testing:TLLVUITests/DemoWalkthroughTests/testDemoWalkthrough \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          STATUS=$?
          sleep 2
          kill -INT $REC
          wait $REC
          tail -40 test.log
          ls -la demo-raw.mp4
          exit $STATUS

      - name: Collect screenshots
        if: always()
        run: |
          ls shots | head -50 || true
          if [ -z "$(ls -A shots 2>/dev/null)" ] && [ -d result.xcresult ]; then
            xcrun xcresulttool export attachments --path result.xcresult --output-path shots || true
            ls shots | head -50 || true
          fi

      - name: Compress video
        if: always()
        run: |
          if command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -i demo-raw.mp4 -vf "scale=-2:1280" -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p -movflags +faststart TLLV-demo.mp4
          else
            cp demo-raw.mp4 TLLV-demo.mp4
          fi
          ls -la TLLV-demo.mp4

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TLLV-demo-video
          path: |
            TLLV-demo.mp4
            shots/
            test.log
            build.log
